<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Diamond Pattern Board — 254 x 1019</title>
<style>
  html, body {
    margin: 0;
    background: #1a1a2e;
    font-family: sans-serif;
    color: #eee;
    overscroll-behavior: none;
  }

  .toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: #16213e;
    z-index: 10;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    font-size: 14px;
    display: flex;
    flex-direction: column;
  }

  .toolbar-row {
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .toolbar span { opacity: 0.8; }

  #coords {
    font-weight: bold;
    opacity: 1;
    background: #0f3460;
    padding: 4px 10px;
    border-radius: 4px;
    min-width: 130px;
  }

  .zoom-controls {
    display: flex;
    gap: 6px;
    margin-left: auto;
  }

  .zoom-controls button {
    background: #0f3460;
    color: #eee;
    border: none;
    border-radius: 4px;
    width: 32px;
    height: 32px;
    font-size: 16px;
    cursor: pointer;
  }

  .zoom-controls button:active {
    background: #0a2647;
  }

  .action-panel {
    display: none;
    flex-direction: column;
    gap: 8px;
    padding: 10px 16px;
    background: #0a2647;
    font-size: 14px;
    border-top: 1px solid #1f3a63;
  }

  .action-panel-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .action-panel button {
    border: none;
    border-radius: 4px;
    padding: 6px 16px;
    font-size: 14px;
    cursor: pointer;
  }

  .dig-btn {
    background: #ff8c1a;
    color: #1a1a2e;
    font-weight: bold;
  }

  .cancel-btn {
    background: #3a3f5a;
    color: #eee;
  }

  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag-btn {
    border: 1px solid #3a3f5a;
    background: transparent;
    color: #eee;
    border-radius: 14px;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
  }

  .tag-btn.active {
    background: #b388ff;
    border-color: #b388ff;
    color: #1a1a2e;
    font-weight: bold;
  }

  .tag-btn.tag-none.active {
    background: #555;
    border-color: #555;
    color: #fff;
  }

  .tag-btn.tag-treasure.active {
    background: #4caf50;
    border-color: #4caf50;
    color: #fff;
  }

  .tag-btn.tag-scrap.active {
    background: #ffb74d;
    border-color: #ffb74d;
    color: #1a1a2e;
  }

  .view-panel {
    display: none;
    padding: 10px 16px;
    background: #0a2647;
    font-size: 14px;
    border-top: 1px solid #1f3a63;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .view-panel button {
    border: none;
    border-radius: 4px;
    padding: 6px 16px;
    font-size: 14px;
    cursor: pointer;
    background: #3a3f5a;
    color: #eee;
  }

  .reset-btn {
    background: #7a2020;
    color: #eee;
    border: none;
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }

  .goto-input {
    width: 70px;
    padding: 5px 8px;
    border-radius: 4px;
    border: 1px solid #3a3f5a;
    background: #0f3460;
    color: #eee;
    font-size: 14px;
  }

  .scroll-wrap {
    overflow: auto;
    flex: 1;
    touch-action: pan-x pan-y;
  }

  .main-layout {
    display: flex;
    width: 100vw;
  }

  .sidebar {
    width: 240px;
    flex-shrink: 0;
    overflow-y: auto;
    background: #16213e;
    border-left: 1px solid #1f3a63;
    padding: 12px;
    box-sizing: border-box;
  }

  .sidebar h3 {
    margin: 16px 0 6px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    opacity: 0.8;
  }

  .sidebar h3:first-child {
    margin-top: 0;
  }

  .sidebar table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  .sidebar td {
    padding: 4px 6px;
    border-bottom: 1px solid #1f3a63;
    cursor: pointer;
  }

  .sidebar tr:hover td {
    background: #0f3460;
  }

  @media (max-width: 700px) {
    .main-layout {
      flex-direction: column;
    }
    .sidebar {
      width: 100%;
      max-height: 200px;
      border-left: none;
      border-top: 1px solid #1f3a63;
    }
  }

  .board-padding {
    display: inline-block;
    padding: 60px;
    box-sizing: content-box;
  }

  .zoom-sizer {
    position: relative;
  }

  .content {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    border: 3px solid #4a5578;
    box-sizing: content-box;
  }

  .content canvas {
    position: absolute;
    left: 0;
    display: block;
  }

  .tile-overlay {
    cursor: pointer;
  }
</style>
</head>

<div class="toolbar">
  <div class="toolbar-row">
    <span>254 &times; 1019 board</span>
    <span id="coords">Clicked: —</span>
    <div class="zoom-controls">
      <button id="zoomOut">−</button>
      <button id="zoomReset">100%</button>
      <button id="zoomIn">+</button>

</div>

    const isPink = (row % 2) === 1;
    if (!isPink) return true;
    return row < ROWS - 1 && col < COLS - 1;
  }

  // Global (tile-independent) pixel center of a diamond — used for accurate

    const rowShift = (row % 2 === 1) ? HW : 0;
    const x = col * (2 * HW) + HW + rowShift;
    const y = row * HH + HH;
    return { x, y };
  }

  function isInsideDiamond(px, py, cx, cy) {
    return Math.abs(px - cx) / HW + Math.abs(py - cy) / HH <= 1;

  let pendingCells = [];   // { info, x, y } — cells currently previewed, not yet committed

  function clearHighlights() {
    highlightedTiles.forEach((idx) => {
      const info = tiles[idx];
      info.octx.clearRect(0, 0, info.overlay.width, info.overlay.height);
    });
    highlightedTiles.clear();
    pendingCells = [];
    pendingCenter = null;
  }

  function drawDiamondShape(ctxTarget, x, y, fillColor) {
    ctxTarget.beginPath();
    ctxTarget.moveTo(x, y - HH);
    ctxTarget.lineTo(x + HW, y);
    ctxTarget.lineTo(x, y + HH);
    ctxTarget.lineTo(x - HW, y);
    ctxTarget.closePath();
    ctxTarget.fillStyle = fillColor;
    ctxTarget.fill();
  }

    ctxTarget.strokeStyle = '#ffffff';
    ctxTarget.lineWidth = 1;
    ctxTarget.beginPath();
    ctxTarget.moveTo(x - 3, y + 5);
    ctxTarget.lineTo(x - 3, y - 5);
    ctxTarget.stroke();
    ctxTarget.fillStyle = '#ff3b3b';
    ctxTarget.beginPath();
    ctxTarget.moveTo(x - 3, y - 5);
    ctxTarget.lineTo(x + 4, y - 2.5);
    ctxTarget.lineTo(x - 3, y);
    ctxTarget.closePath();
    ctxTarget.fill();
    ctxTarget.restore();
  }

    ctxTarget.lineWidth = 1.5;
    ctxTarget.beginPath();
    ctxTarget.moveTo(x - 4, y - 4);
    ctxTarget.lineTo(x + 4, y + 4);
    ctxTarget.moveTo(x + 4, y - 4);
    ctxTarget.lineTo(x - 4, y + 4);
    ctxTarget.stroke();
    ctxTarget.restore();
  }

  // O icon (scrap)
  function drawO(ctxTarget, x, y) {
    ctxTarget.save();
    ctxTarget.strokeStyle = '#ffffff';
    ctxTarget.lineWidth = 1.5;
    ctxTarget.beginPath();
    ctxTarget.arc(x, y, 4, 0, Math.PI * 2);
    ctxTarget.stroke();
    ctxTarget.restore();
  }

  // "?" hint marker — for the efficient full-coverage dig lattice
  function drawQuestionMark(ctxTarget, x, y) {
    ctxTarget.save();
    ctxTarget.fillStyle = '#ffffff';
    ctxTarget.font = 'bold 9px sans-serif';
    ctxTarget.textAlign = 'center';
    ctxTarget.textBaseline = 'middle';
    ctxTarget.fillText('?', x, y + 0.5);
    ctxTarget.restore();
  }

  const FILL_BLACK = '#111111';
  const FILL_PURPLE = '#b388ff';
  const FILL_TREASURE = '#4caf50';
  const FILL_SCRAP = '#ffb74d';

  // Which visual category a set of tags maps to
  function categoryOf(tags) {
    if (!tags || tags.length === 0) return 'none';
    if (tags.includes('treasure')) return 'treasure';
    if (tags.includes('scrap')) return 'scrap';
    return 'directional';
  }

  // Bottom-to-top render priority when digs overlap: none < directions <
  // scrap < treasure. Higher-priority categories always show through,
  // regardless of which order the digs actually happened in.
  const CATEGORY_PRIORITY = { none: 0, directional: 1, scrap: 2, treasure: 3 };

  // Returns every drawable diamond within RADIUS_PX of (centerRow, centerCol),
  // each resolved to its owning tile + local pixel position for direct drawing.
  function getRegionCells(centerRow, centerCol) {
    const { x: cx, y: cy } = centerOfGlobal(centerRow, centerCol);

    const colIdxRadius = Math.ceil(RADIUS_PX / (2 * HW)) + 1;
    const rowRadius = Math.ceil(RADIUS_PX / HH) + 1;

    const colMin = Math.max(0, centerCol - colIdxRadius);
    const colMax = Math.min(COLS - 1, centerCol + colIdxRadius);
    const rowMin = Math.max(0, centerRow - rowRadius);
    const rowMax = Math.min(ROWS - 1, centerRow + rowRadius);

    const cells = [];
    for (let row = rowMin; row <= rowMax; row++) {
      const tIdx = Math.floor(row / TILE_ROWS);
      const info = tiles[tIdx];
      if (!info) continue;
      const localRow = row - info.rowStart;

      for (let col = colMin; col <= colMax; col++) {
        if (!shouldDraw(row, col)) continue;
        const { x, y } = centerOfGlobal(row, col);
        if (Math.abs(x - cx) + Math.abs(y - cy) > RADIUS_PX) continue;
        const localY = localRow * HH + HH;
        cells.push({ info, x, y: localY });
      }
    }
    return cells;
  }

  function highlightRegion(centerRow, centerCol) {
    clearHighlights();
    pendingCenter = { row: centerRow, col: centerCol };
    pendingCells = getRegionCells(centerRow, centerCol);
    pendingCells.forEach(({ info, x, y }) => {
      drawDiamondShape(info.octx, x, y, FILL_PURPLE);
      highlightedTiles.add(tiles.indexOf(info));
    });
    resetTagSelection();
    showActionPanel(true);
  }

  // ---- Tags ----
  const DIRECTIONAL_TAGS = ['top', 'bottom', 'left', 'right', 'very far', 'far', 'close', 'very close'];
  const EXCLUSIVE_TAGS = ['none', 'treasure', 'scrap'];
  const TAGS = [...DIRECTIONAL_TAGS, ...EXCLUSIVE_TAGS];
  const selectedTags = new Set();
  const tagRow = document.getElementById('tagRow');

  TAGS.forEach((tag) => {
    const btn = document.createElement('button');
    btn.textContent = tag;
    const extraClass = tag === 'none' ? ' tag-none' : tag === 'treasure' ? ' tag-treasure' : tag === 'scrap' ? ' tag-scrap' : '';
    btn.className = 'tag-btn' + extraClass;
    btn.dataset.tag = tag;
    btn.addEventListener('click', () => toggleTag(tag));
    tagRow.appendChild(btn);
  });

  function toggleTag(tag) {
    if (EXCLUSIVE_TAGS.includes(tag)) {
      // none / treasure / scrap each wipe out any other selection
      selectedTags.clear();
      selectedTags.add(tag);
    } else {
      // a directional/distance tag clears any exclusive selection but
      // stacks freely with other directional/distance tags
      EXCLUSIVE_TAGS.forEach((t) => selectedTags.delete(t));
      if (selectedTags.has(tag)) {
        selectedTags.delete(tag);
      } else {
        selectedTags.add(tag);
      }
    }
    refreshTagButtons();
  }

  function refreshTagButtons() {
    tagRow.querySelectorAll('.tag-btn').forEach((b) => {
      b.classList.toggle('active', selectedTags.has(b.dataset.tag));
    });
  }

  function resetTagSelection() {
    selectedTags.clear();
    refreshTagButtons();
  }

  // ---- Saved dig records ----
  // If Firebase is configured, every dig is written to Firestore and pushed
  // live to everyone else via onSnapshot. If not, falls back to this
  // browser's localStorage only (matches prior single-device behavior).
  const STORAGE_KEY = 'diamondDigRecords';
  const digMap = new Map(); // "row,col" -> tags[]  (only the exact clicked/dug coordinate)

  function loadLocalRecords() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveDigRecord(row, col, tags) {
    digMap.set(`${row},${col}`, tags);

    if (db) {
      const id = `${row}_${col}`;
      fsSetDoc(fsDoc(db, 'digs', id), { row, col, tags }).catch((e) => {
        console.error('Firestore write failed', e);
      });
    } else {
      const records = loadLocalRecords().filter((r) => !(r.row === row && r.col === col));
      records.push({ row, col, tags });
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); } catch (e) {}
    }
  }

  function removeDigRecord(row, col) {
    digMap.delete(`${row},${col}`);

    if (db) {
      const id = `${row}_${col}`;
      fsDeleteDoc(fsDoc(db, 'digs', id)).catch((e) => {
        console.error('Firestore delete failed', e);
      });
    } else {
      const records = loadLocalRecords().filter((r) => !(r.row === row && r.col === col));
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); } catch (e) {}
    }
  }

  async function clearAllDigRecords() {
    digMap.clear();
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}

    if (db) {
      const snapshot = await fsGetDocs(digsCollectionRef);
      const docs = snapshot.docs;
      const CHUNK = 450;
      for (let i = 0; i < docs.length; i += CHUNK) {
        const batch = fsWriteBatch(db);
        docs.slice(i, i + CHUNK).forEach((d) => batch.delete(d.ref));
        await batch.commit();
      }
    }
  }

  // Fills a region permanently (used both for a live Dig and for replaying
  // saved records on page load) and draws the matching icon if tagged.
  function applyDig(row, col, tags) {
    const category = categoryOf(tags);
    const fillColor = category === 'none' ? FILL_BLACK
      : category === 'treasure' ? FILL_TREASURE
      : category === 'scrap' ? FILL_SCRAP
      : FILL_PURPLE;

    const cells = getRegionCells(row, col);
    cells.forEach(({ info, x, y }) => drawDiamondShape(info.ctx, x, y, fillColor));

    if (category !== 'none') {
      const { x: cx } = centerOfGlobal(row, col);
      const tIdx = Math.floor(row / TILE_ROWS);
      const info = tiles[tIdx];
      const localY = (row - info.rowStart) * HH + HH;
      if (category === 'treasure') drawX(info.ctx, cx, localY);
      else if (category === 'scrap') drawO(info.ctx, cx, localY);
      else drawFlag(info.ctx, cx, localY);
    }
  }

  // Redraws the entire board from scratch: base pattern + hints, then every
  // saved dig applied in priority order (none first, treasure last) so that
  // wherever dig regions overlap, the higher-priority category always wins,
  // regardless of which order the digs actually happened in.
  function rebuildBoard() {
    tiles.forEach((info) => {
      info.drawBasePattern();
      info.octx.clearRect(0, 0, info.overlay.width, info.overlay.height);
    });

    const records = [];
    digMap.forEach((tags, key) => {
      const [row, col] = key.split(',').map(Number);
      records.push({ row, col, tags, priority: CATEGORY_PRIORITY[categoryOf(tags)] });
    });
    records.sort((a, b) => a.priority - b.priority);
    records.forEach((r) => applyDig(r.row, r.col, r.tags));
  }

  function commitDig() {
    if (!pendingCenter) return;
    const tags = selectedTags.has('none') ? [] : Array.from(selectedTags);
    saveDigRecord(pendingCenter.row, pendingCenter.col, tags);
    rebuildBoard();
    refreshTagTables();

    highlightedTiles.forEach((idx) => {
      const info = tiles[idx];
      info.octx.clearRect(0, 0, info.overlay.width, info.overlay.height);
    });
    highlightedTiles.clear();
    pendingCells = [];
    pendingCenter = null;
    resetTagSelection();
    showActionPanel(false);
  }

  function cancelDig() {
    clearHighlights();
    resetTagSelection();
    showActionPanel(false);
  }

  const actionPanel = document.getElementById('actionPanel');
  function showActionPanel(visible) {
    actionPanel.style.display = visible ? 'flex' : 'none';
  }

  const viewPanel = document.getElementById('viewPanel');
  const viewPanelText = document.getElementById('viewPanelText');
  let viewingCoord = null; // { row, col } for whichever tagged coordinate is currently shown

  function showViewPanel(row, col, tags) {
    viewingCoord = { row, col };
    const category = categoryOf(tags);
    let text;
    if (category === 'none') text = 'Tagged: None (black)';
    else if (category === 'treasure') text = 'Tagged: Treasure';
    else if (category === 'scrap') text = 'Tagged: Scrap';
    else text = 'Tagged: ' + tags.join(', ');
    viewPanelText.textContent = text;
    viewPanel.style.display = 'flex';
  }

  document.getElementById('viewCloseBtn').addEventListener('click', () => {
    viewPanel.style.display = 'none';
    viewingCoord = null;
  });

  document.getElementById('viewEditBtn').addEventListener('click', () => {
    if (!viewingCoord) return;
    const { row, col } = viewingCoord;
    const existingTags = digMap.get(`${row},${col}`) || [];
    viewPanel.style.display = 'none';
    viewingCoord = null;

    highlightRegion(row, col); // sets up preview + resets tag selection + shows action panel
    if (existingTags.length === 0) {
      selectedTags.add('none');
    } else {
      existingTags.forEach((t) => selectedTags.add(t));
    }
    refreshTagButtons();
    digBtn.textContent = 'Update';
  });

  document.getElementById('viewRemoveBtn').addEventListener('click', () => {
    if (!viewingCoord) return;
    const { row, col } = viewingCoord;
    removeDigRecord(row, col);
    rebuildBoard();
    refreshTagTables();
    viewPanel.style.display = 'none';
    viewingCoord = null;
  });

  const digBtn = document.getElementById('digBtn');
  digBtn.addEventListener('click', commitDig);
  document.getElementById('cancelBtn').addEventListener('click', cancelDig);

  // Shared by both clicking a diamond and using the "Go to" coordinate box —
  // exactly the same behavior either way: show existing tags if already dug,
  // otherwise start the dig-region preview.
  //
  // Column numbering depends on row parity, matching the real geometry: pink
  // rows sit half a diamond-width to the right of blue rows, so their column
  // numbers are shifted by 1. Blue (even rows) → odd columns starting at 3.
  // Pink (odd rows) → even columns starting at 4. First blue diamond is
  // (3,3); first pink diamond is (4,4).
  function colNumFor(row, col) {
    const parityShift = (row % 2 === 1) ? 1 : 0;
    return COL_OFFSET + col * 2 + parityShift;
  }

  function selectDiamond(row, col) {
    const colNum = colNumFor(row, col);
    const rowNum = row + ROW_OFFSET;
    coordsLabel.textContent = `Clicked: (${colNum}, ${rowNum})`;

    const key = `${row},${col}`;
    if (digMap.has(key)) {
      showActionPanel(false);
      showViewPanel(row, col, digMap.get(key));
    } else {
      viewPanel.style.display = 'none';
      highlightRegion(row, col);
      digBtn.textContent = 'Dig';
    }
  }

  // ---- Sidebar tag tables (Treasure / Scrap / Directions) ----
  function fillTable(tbodyId, rows) {
    const tbody = document.getElementById(tbodyId);
    tbody.innerHTML = '';
    if (rows.length === 0) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.textContent = '—';
      td.colSpan = 2;
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }
    rows.forEach(({ label, detail, row, col }) => {
      const tr = document.createElement('tr');
      const tdCoord = document.createElement('td');
      tdCoord.textContent = label;
      tr.appendChild(tdCoord);
      if (detail !== undefined) {
        const tdDetail = document.createElement('td');
        tdDetail.textContent = detail;
        tr.appendChild(tdDetail);
      }
      tr.addEventListener('click', () => {
        selectDiamond(row, col);
        scrollToDiamond(row, col);
      });
      tbody.appendChild(tr);
    });
  }

  function refreshTagTables() {
    const treasureRows = [];
    const scrapRows = [];
    const dirRows = [];

    digMap.forEach((tags, key) => {
      const [row, col] = key.split(',').map(Number);
      const category = categoryOf(tags);
      const colNum = colNumFor(row, col);
      const rowNum = row + ROW_OFFSET;
      const label = `(${colNum}, ${rowNum})`;

      if (category === 'treasure') treasureRows.push({ label, row, col, sortKey: rowNum * 100000 + colNum });
      else if (category === 'scrap') scrapRows.push({ label, row, col, sortKey: rowNum * 100000 + colNum });
      else if (category === 'directional') dirRows.push({ label, detail: tags.join(', '), row, col, sortKey: rowNum * 100000 + colNum });
    });

    const bySort = (a, b) => a.sortKey - b.sortKey;
    treasureRows.sort(bySort);
    scrapRows.sort(bySort);
    dirRows.sort(bySort);

    fillTable('treasureTableBody', treasureRows);
    fillTable('scrapTableBody', scrapRows);
    fillTable('directionsTableBody', dirRows);

    // "?" hint points that haven't been dug/tagged yet
    const untaggedRows = HINT_POINTS
      .filter(([row, col]) => !digMap.has(`${row},${col}`))
      .map(([row, col]) => {
        const colNum = colNumFor(row, col);
        const rowNum = row + ROW_OFFSET;
        return { label: `(${colNum}, ${rowNum})`, row, col, sortKey: rowNum * 100000 + colNum };
      })
      .sort(bySort);

    fillTable('untaggedTableBody', untaggedRows);
  }

  const tiles = [];

  for (let t = 0; t < numTiles; t++) {
    const rowStart = t * TILE_ROWS;
    const rowEnd = Math.min(ROWS, rowStart + TILE_ROWS);
    const N = rowEnd - rowStart;
    const tileHeight = (N + 1) * HH;
    const tileTop = rowStart * HH;

    const bg = document.createElement('canvas');
    const overlay = document.createElement('canvas');
    bg.width = overlay.width = canvasWidth;
    bg.height = overlay.height = tileHeight;
    bg.style.top = overlay.style.top = tileTop + 'px';
    overlay.className = 'tile-overlay';

    content.appendChild(bg);
    content.appendChild(overlay);

    const ctx = bg.getContext('2d');
    const octx = overlay.getContext('2d');

    // local (i) = row within tile; global row = rowStart + i
    function centerOfLocal(i, col) {
      const rowShift = (i % 2 === 1) ? HW : 0;
      const x = col * (2 * HW) + HW + rowShift;
      const y = i * HH + HH;
      return { x, y };
    }

    const paths = colors.map(() => new Path2D());
    for (let i = 0; i < N; i++) {
      const globalRow = rowStart + i;
      for (let col = 0; col < COLS; col++) {
        if (!shouldDraw(globalRow, col)) continue;
        const { x, y } = centerOfLocal(i, col);
        const colorIndex = globalRow % colors.length;
        const p = paths[colorIndex];
        p.moveTo(x, y - HH);
        p.lineTo(x + HW, y);
        p.lineTo(x, y + HH);
        p.lineTo(x - HW, y);
        p.closePath();
      }
    }

    // Hint markers ("?") for this tile's row range — part of the base state
    const tileHints = HINT_POINTS
      .filter(([r]) => r >= rowStart && r < rowEnd)
      .map(([r, c]) => {
        const localI = r - rowStart;
        const { x, y } = centerOfLocal(localI, c);
        return { x, y };
      });

    function drawBasePattern() {
      ctx.clearRect(0, 0, bg.width, bg.height);
      paths.forEach((p, i2) => {
        ctx.fillStyle = colors[i2];
        ctx.fill(p);
      });
      tileHints.forEach(({ x, y }) => drawQuestionMark(ctx, x, y));
    }
    drawBasePattern();

    function hitTest(px, py) {
      const iGuess = Math.round((py - HH) / HH);
      for (let i = Math.max(0, iGuess - 1); i <= Math.min(N - 1, iGuess + 1); i++) {
        const globalRow = rowStart + i;
        const rowShift = (i % 2 === 1) ? HW : 0;
        const colGuess = Math.round((px - HW - rowShift) / (2 * HW));
        for (let col = Math.max(0, colGuess - 1); col <= Math.min(COLS - 1, colGuess + 1); col++) {
          if (!shouldDraw(globalRow, col)) continue;
          const { x, y } = centerOfLocal(i, col);
          if (isInsideDiamond(px, py, x, y)) {
            return { row: globalRow, col, x, y };
          }
        }
      }
      return null;
    }

    overlay.addEventListener('click', (e) => {
      const rect = overlay.getBoundingClientRect();
      const scaleX = overlay.width / rect.width;
      const scaleY = overlay.height / rect.height;
      const px = (e.clientX - rect.left) * scaleX;
      const py = (e.clientY - rect.top) * scaleY;

      const hit = hitTest(px, py);
      if (hit) {
        selectDiamond(hit.row, hit.col);
      }
    });

    tiles.push({ bg, overlay, octx, ctx, rowStart, N, drawBasePattern });
  }

  // ---- Load + live-sync dig records ----
  if (db) {
    fsOnSnapshot(digsCollectionRef, (snapshot) => {
      syncStatus.textContent = '🔥 Live — shared with everyone';
      digMap.clear();
      snapshot.docs.forEach((d) => {
        const data = d.data();
        digMap.set(`${data.row},${data.col}`, data.tags);
      });
      rebuildBoard();
      refreshTagTables();
    }, (err) => {
      console.error('Firestore listener error', err);
      syncStatus.textContent = '📴 Local only (sync error)';
    });
  } else {
    // Local-only fallback
    loadLocalRecords().forEach(({ row, col, tags }) => {
      digMap.set(`${row},${col}`, tags);
    });
    rebuildBoard();
    refreshTagTables();
  }

  // ---- Reset board ----
  const resetConfirmPanel = document.getElementById('resetConfirmPanel');

  document.getElementById('resetBoard').addEventListener('click', () => {
    showActionPanel(false);
    viewPanel.style.display = 'none';
    resetConfirmPanel.style.display = 'flex';
  });

  document.getElementById('resetConfirmNo').addEventListener('click', () => {
    resetConfirmPanel.style.display = 'none';
  });

  document.getElementById('resetConfirmYes').addEventListener('click', () => {
    resetConfirmPanel.style.display = 'none';

    // clearAllDigRecords() clears digMap synchronously before it does any
    // awaiting, so the local rebuild is instant — the Firestore deletion
    // (if configured) completes in the background.
    clearAllDigRecords().catch((e) => console.error('Reset sync failed', e));
    rebuildBoard();
    highlightedTiles.clear();
    pendingCells = [];
    pendingCenter = null;
    resetTagSelection();
    showActionPanel(false);
    viewPanel.style.display = 'none';
    coordsLabel.textContent = 'Clicked: —';
    refreshTagTables();
  });

  // ---- Zoom (custom, replaces native pinch-zoom so the toolbar stays put) ----
  let zoom = 1;
  const ZOOM_MIN = 0.5;
  const ZOOM_MAX = 4;
  const ZOOM_STEP = 0.5;

  function applyZoom() {
    content.style.transform = `scale(${zoom})`;
    sizer.style.width = (canvasWidth * zoom + 6) + 'px';
    sizer.style.height = (fullHeight * zoom + 6) + 'px';
  }
  applyZoom();

  document.getElementById('zoomIn').addEventListener('click', () => {
    zoom = Math.min(ZOOM_MAX, zoom + ZOOM_STEP);
    applyZoom();
  });
  document.getElementById('zoomOut').addEventListener('click', () => {
    zoom = Math.max(ZOOM_MIN, zoom - ZOOM_STEP);
    applyZoom();
  });
  document.getElementById('zoomReset').addEventListener('click', () => {
    zoom = 1;
    applyZoom();
  });

  // ---- Manual "Go to coordinate" ----
  const gotoColInput = document.getElementById('gotoCol');
  const gotoRowInputEl = document.getElementById('gotoRowInput');
  const gotoError = document.getElementById('gotoError');

  function scrollToDiamond(row, col) {
    const { x, y } = centerOfGlobal(row, col);
    const PADDING = 60; // matches .board-padding
    const targetLeft = PADDING + x * zoom - scrollWrap.clientWidth / 2;
    const targetTop = PADDING + y * zoom - scrollWrap.clientHeight / 2;
    scrollWrap.scrollTo({
      left: Math.max(0, targetLeft),
      top: Math.max(0, targetTop),
      behavior: 'smooth'
    });
  }

  function goToCoordinate() {
    gotoError.textContent = '';
    const colNum = parseInt(gotoColInput.value, 10);
    const rowNum = parseInt(gotoRowInputEl.value, 10);

    if (isNaN(colNum) || isNaN(rowNum)) {
      gotoError.textContent = 'Enter both numbers';
      return;
    }

    const row = rowNum - ROW_OFFSET;
    if (row < 0 || row > ROWS - 1) {
      gotoError.textContent = 'Row out of range';
      return;
    }

    // Column numbering is row-parity-dependent (see colNumFor)
    const parityShift = (row % 2 === 1) ? 1 : 0;
    const rawCol = colNum - COL_OFFSET - parityShift;
    if (rawCol < 0 || rawCol % 2 !== 0) {
      gotoError.textContent = row % 2 === 1 ? 'For this row, column must be 4, 6, 8...' : 'For this row, column must be 3, 5, 7...';
      return;
    }

    const col = rawCol / 2;
    if (col < 0 || col > COLS - 1) {
      gotoError.textContent = 'Column out of range';
      return;
    }
    if (!shouldDraw(row, col)) {
      gotoError.textContent = 'No diamond there';
      return;
    }

    selectDiamond(row, col);
    scrollToDiamond(row, col);
  }

  document.getElementById('gotoBtn').addEventListener('click', goToCoordinate);
  [gotoColInput, gotoRowInputEl].forEach((el) => {
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') goToCoordinate();
    });
  });

  // Keep the scrollable board area below the toolbar, even if its height changes
  const toolbar = document.querySelector('.toolbar');

  function syncToolbarOffset() {
    const h = toolbar.offsetHeight;
    mainLayout.style.marginTop = h + 'px';
    mainLayout.style.height = `calc(100vh - ${h}px)`;
  }
  syncToolbarOffset();
  window.addEventListener('resize', syncToolbarOffset);
  new ResizeObserver(syncToolbarOffset).observe(toolbar);
</script>

</body>
</html>
